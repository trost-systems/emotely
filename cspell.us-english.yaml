# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
# US English everywhere we write (`pnpm spell`, CI's tripwire job): code
# comments and strings, docs, skills, ADRs, scripts, config comments and
# the English ARB files whole (keys and descriptions too). Only the British
# spellings below fail; every other word passes unchecked, so a library
# name or an identifier never needs a dictionary entry here. The app's copy
# gets the full dictionary check in cspell.config.yaml.
version: "0.2"
language: en-US
# Report a word only when it is in flagWords; unknown words pass.
unknownWords: report-flagged
minWordLength: 3
files:
  - "**/*.{dart,ts,mts,cts,tsx,js,mjs,cjs,md,sh,yaml,yml}"
  # `**` skips dot directories: the skills and the workflows.
  - ".claude/**/*.{dart,ts,md,sh,yaml,yml}"
  - ".github/**/*.{md,sh,yaml,yml}"
  - "apps/mobile/**/l10n/*_en.arb"
  # The release tooling (fastlane's Ruby) and the English store listings.
  - "apps/mobile/app/{Gemfile,fastlane/Fastfile,fastlane/Appfile,fastlane/Matchfile}"
  - "apps/mobile/app/fastlane/**/*.rb"
  - "apps/mobile/app/fastlane/metadata/**/en-US/**/*.txt"
  - "apps/mobile/app/fastlane/metadata/en-US/*.txt"
  - "apps/mobile/app/fastlane/app_review/*.txt"
useGitignore: true
ignorePaths:
  # Generated: build_runner, freezed, mockito, gen-l10n (from the English
  # ARB files, which are checked), Jaspr.
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*.mocks.dart"
  - "**/l10n/*_localizations*.dart"
  - "apps/web/lib/*.options.dart"
  - "pnpm-lock.yaml"
  # Third-party text: Flutter's project template.
  - "**/LaunchImage.imageset/README.md"
  # The symlinks to each AGENTS.md: checked once, as AGENTS.md.
  - "**/CLAUDE.md"
  # This file lists the British spellings it flags, and its test's fixtures
  # spell them on purpose.
  - "cspell.us-english.yaml"
  - "scripts/spell.test.sh"
patterns:
  # GitHub Actions spells a canceled run's result "cancelled"; its API
  # value, quoted or as the `cancelled()` function, is not ours to respell.
  - name: github-cancelled
    pattern: /cancelled\(\)|(['"`])cancelled\1/g
ignoreRegExpList: [github-cancelled]
# British spelling -> US spelling. Lower case flags every casing. A word
# that is US English too stays out ("advertise", "compromise", "dialogue",
# "analyses" as the plural of analysis), and so does "grey": Flutter's API
# spells it (`Colors.grey`).
flagWords:
  # -our
  - "behaviour->behavior"
  - "behaviours->behaviors"
  - "behavioural->behavioral"
  - "colour->color"
  - "colours->colors"
  - "coloured->colored"
  - "colouring->coloring"
  - "colourful->colorful"
  - "recolour->recolor"
  - "recoloured->recolored"
  - "favour->favor"
  - "favours->favors"
  - "favoured->favored"
  - "favourite->favorite"
  - "favourites->favorites"
  - "flavour->flavor"
  - "flavours->flavors"
  - "honour->honor"
  - "honours->honors"
  - "honoured->honored"
  - "honouring->honoring"
  - "humour->humor"
  - "labour->labor"
  - "neighbour->neighbor"
  - "neighbours->neighbors"
  - "neighbouring->neighboring"
  - "rumour->rumor"
  - "endeavour->endeavor"
  - "harbour->harbor"
  - "vapour->vapor"
  # -ise, -isation (but never "advertise", "compromise", "exercise",
  # "promise", "surprise", "revise", "analyses" (plural of analysis):
  # those are US English too)
  - "analyse->analyze"
  - "analysed->analyzed"
  - "analysing->analyzing"
  - "anonymise->anonymize"
  - "anonymised->anonymized"
  - "anonymisation->anonymization"
  - "apologise->apologize"
  - "authorise->authorize"
  - "authorised->authorized"
  - "authorisation->authorization"
  - "capitalise->capitalize"
  - "capitalised->capitalized"
  - "capitalisation->capitalization"
  - "categorise->categorize"
  - "categorised->categorized"
  - "centralise->centralize"
  - "centralised->centralized"
  - "customise->customize"
  - "customised->customized"
  - "customisation->customization"
  - "emphasise->emphasize"
  - "emphasised->emphasized"
  - "finalise->finalize"
  - "finalised->finalized"
  - "finalises->finalizes"
  - "generalise->generalize"
  - "initialise->initialize"
  - "initialised->initialized"
  - "initialises->initializes"
  - "initialising->initializing"
  - "initialisation->initialization"
  - "localise->localize"
  - "localised->localized"
  - "localisation->localization"
  - "materialise->materialize"
  - "minimise->minimize"
  - "minimised->minimized"
  - "minimisation->minimization"
  - "maximise->maximize"
  - "normalise->normalize"
  - "normalised->normalized"
  - "normalises->normalizes"
  - "normalising->normalizing"
  - "normalisation->normalization"
  - "optimise->optimize"
  - "optimised->optimized"
  - "optimisation->optimization"
  - "organise->organize"
  - "organised->organized"
  - "organising->organizing"
  - "organisation->organization"
  - "organisations->organizations"
  - "paralyse->paralyze"
  - "personalise->personalize"
  - "personalised->personalized"
  - "personalisation->personalization"
  - "prioritise->prioritize"
  - "prioritised->prioritized"
  - "pseudonymise->pseudonymize"
  - "pseudonymised->pseudonymized"
  - "pseudonymisation->pseudonymization"
  - "realise->realize"
  - "realised->realized"
  - "recognise->recognize"
  - "recognised->recognized"
  - "recognises->recognizes"
  - "recognising->recognizing"
  - "recognisable->recognizable"
  - "unrecognised->unrecognized"
  - "sanitise->sanitize"
  - "sanitised->sanitized"
  - "serialise->serialize"
  - "serialised->serialized"
  - "serialisable->serializable"
  - "serialisation->serialization"
  - "deserialise->deserialize"
  - "specialise->specialize"
  - "specialised->specialized"
  - "standardise->standardize"
  - "standardised->standardized"
  - "summarise->summarize"
  - "summarised->summarized"
  - "summarises->summarizes"
  - "synchronise->synchronize"
  - "synchronised->synchronized"
  - "tokenise->tokenize"
  - "utilise->utilize"
  - "visualise->visualize"
  # -re, -ogue, -ence, -mme
  - "centre->center"
  - "centres->centers"
  - "centred->centered"
  - "metre->meter"
  - "metres->meters"
  - "fibre->fiber"
  - "catalogue->catalog"
  - "catalogues->catalogs"
  - "analogue->analog"
  - "licence->license"
  - "licences->licenses"
  - "defence->defense"
  - "offence->offense"
  - "pretence->pretense"
  - "programme->program"
  - "programmes->programs"
  # Doubled l (US English doubles it only when the stress is on the
  # last syllable: "controlled", "compelling" are right)
  - "cancelled->canceled"
  - "cancelling->canceling"
  - "labelled->labeled"
  - "labelling->labeling"
  - "mislabelled->mislabeled"
  - "mislabelling->mislabeling"
  - "levelled->leveled"
  - "modelled->modeled"
  - "modelling->modeling"
  - "signalled->signaled"
  - "signalling->signaling"
  - "travelled->traveled"
  - "travelling->traveling"
  - "traveller->traveler"
  - "fuelled->fueled"
  - "totalled->totaled"
  - "channelled->channeled"
  - "tunnelled->tunneled"
  - "enrol->enroll"
  - "enrolment->enrollment"
  - "fulfil->fulfill"
  - "fulfilment->fulfillment"
  # Other
  - "ageing->aging"
  - "artefact->artifact"
  - "artefacts->artifacts"
  - "judgement->judgment"
  - "judgements->judgments"
  - "learnt->learned"
  - "misspelt->misspelled"
  - "spelt->spelled"
  - "practise->practice"
  - "sceptical->skeptical"
  - "whilst->while"

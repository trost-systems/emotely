# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
# The copy spell check (ADR 0020, `pnpm spell`, CI's tripwire job): every
# message a user reads in the app's ARB files and in the store listings
# (fastlane's metadata folder), in its own language, the question wordings
# the agent's question set shows them, and the words CONTEXT.md says to
# avoid. In ARB files, keys, descriptions and placeholder examples are not
# copy and are not checked here. British spellings, in the copy and
# everywhere else we write, are cspell.us-english.yaml's.
version: "0.2"
# Short copy words matter too ("teh"); the default is 4.
minWordLength: 3
files:
  - "apps/mobile/**/l10n/*.arb"
  # The questions a user reads word for word (#228): the agent's question
  # set, each wording under its language key (overrides below).
  - "apps/agent/src/default-question-set.ts"
  - "apps/mobile/app/fastlane/metadata/**/*.txt"
  - "apps/mobile/app/fastlane/app_review/*.txt"
  - "apps/mobile/app/fastlane/console/*.txt"
import:
  - "@cspell/dict-de-de/cspell-ext.json"
dictionaryDefinitions:
  # Names and terms the copy uses in every language.
  - name: project-words
    path: ./cspell/project-words.txt
    addWords: true
  # German words the de-DE dictionary lacks but the copy uses correctly.
  - name: de-words
    path: ./cspell/de-words.txt
    addWords: true
dictionaries:
  - project-words
patterns:
  # A message's value: the string after a key that is neither metadata
  # (`@key`) nor one of the metadata's own fields. A new string-valued
  # metadata field goes into this list, or its text is checked as copy.
  - name: arb-message-value
    pattern: |
      /
        (?<= (?<!\\)"
             (?!@)
             (?!(?:description|type|example|format|optionalParameters|isCustomDateFormat)")
             [^"\\]+ " \s* : \s* " )
        (?: [^"\\] | \\. )*
      /gmx
  # ICU syntax inside a message: `{name}`, `{count, plural,` and the
  # selectors before a branch (`=1{`, `other{`).
  - name: icu-argument
    pattern: /\{\s*\w+\s*(?:,\s*(?:plural|select|selectordinal|number|date|time)\s*,?)?\s*(?=[{},])/g
  - name: icu-selector
    pattern: /(?<=[{},]\s*)(?:=\d+|\w+)\s*(?=\{)/g
  # A question's wording in the agent's question set, per language.
  - name: question-text
    pattern: '/(?<=\b(?:en|de): ")[^"]*/g'
  - name: json-escape
    pattern: /\\[nrtbf"\\\/]|\\u[0-9a-fA-F]{4}/g
ignoreRegExpList: [icu-argument, icu-selector, json-escape]
# Per format first: in an ARB file only the message values are copy, while a
# store listing file is copy as a whole. Then the words CONTEXT.md says to
# avoid, per language. A new one goes here in the same change that adds it
# there; `from->to` names the word to use.
overrides:
  - filename: "**/*.arb"
    includeRegExpList: [arb-message-value]
  - filename:
      - "**/l10n/*_en.arb"
      - "**/fastlane/metadata/en-US/*.txt"
      - "**/fastlane/metadata/android/en-US/**/*.txt"
      # App Review information and Play's sign-in instructions, read by the
      # stores' reviewers in English.
      - "**/fastlane/app_review/*.txt"
      - "**/fastlane/console/*.txt"
    language: en-US
    # The App Store keywords' abbreviation for cognitive behavioral therapy.
    words: [cbt]
    flagWords:
      - "assistant->emotely"
      - "assistants->emotely"
  - filename:
      - "**/l10n/*_de.arb"
      - "**/fastlane/metadata/de-DE/*.txt"
      - "**/fastlane/metadata/android/de-DE/**/*.txt"
    language: de
    dictionaries: [de-words]
    flagWords:
      - "assistent->emotely"
      - "sitzung->Session"
      - "sitzungen->Sessions"
      - "datenschutzhinweis->Datenschutzerklärung"
      - "datenschutzhinweise->Datenschutzerklärung"
  # The question set holds both languages in one file: only the wordings are
  # copy (`en: "…"`, `de: "…"` inside each `text`), checked against both
  # languages and the words to avoid in each.
  - filename: "apps/agent/src/default-question-set.ts"
    language: en-US,de
    dictionaries: [de-words]
    includeRegExpList: [question-text]
    flagWords:
      - "assistant->emotely"
      - "assistent->emotely"
      - "sitzung->Session"

id: suppression-reason-typescript
valid:
  # A reason on the same line.
  - |
    // @ts-expect-error the fixture is malformed on purpose here
    f(2);
  # A reason on the comment line above.
  - |
    // The fixture is malformed on purpose here.
    // @ts-expect-error
    f(0);
  # A block comment above counts by its last line.
  - |
    /* The fixture is malformed on purpose. */
    // @ts-expect-error
    f(0);
  # A directive that opens the file may take its reason from below.
  - |
    // @ts-nocheck
    // Vendored as published; its types are upstream's to fix.
    export const a = 1;
  # biome already rejects a `biome-ignore` without its explanation
  # (`suppressions/parse`) and any `@ts-ignore` (`noTsIgnore`), so the
  # tripwire leaves both to it, with biome's own bar for the explanation.
  - |
    x;
    // biome-ignore lint/style/noMagicNumbers
    y;
  - |
    x;
    // biome-ignore lint/security/noSecrets: ok
    y;
  - |
    x;
    /* @ts-ignore */ f(3);
invalid:
  - |
    // @ts-expect-error
    f(1);
  - |
    x;
    // @ts-nocheck
    f(1);
  - |
    x;
    // @ts-expect-error -- needed
    f(1);
  # A biome explanation above is that directive's reason, not this one's.
  - |
    x;
    // biome-ignore lint/style/noMagicNumbers: the literal is the documented limit
    // @ts-expect-error
    f(1);
  # A directive on an inner line of a block comment is still one.
  - |
    x;
    /*
     * @ts-expect-error
     */
    f(4);

---
id: suppression-reason-bash
language: bash
severity: error
utils:
  directive:
    kind: comment
    regex: '(?m)^[ \t]*#+[ \t]*shellcheck[ \t]+disable=[\w,]+'
  # After the code list, which the next character must end: otherwise the
  # regex could split `SC2086` and count its tail as a word.
  reason-beside:
    regex: '(?m)^[ \t]*#+[ \t]*shellcheck[ \t]+disable=[\w,]+[^\w,\n](?:[ \t]*(?:[^\s]+[ \t]+)*?[^\s\p{L}]*\p{L}[^\s]*(?:[ \t]|$)){4}'
  suppression:
    kind: comment
    regex: '(?m)^[ \t]*(?:/{2,}|/\*+|\*+|#+)?[ \t]*(?:ignore(?:_for_file)?:[ \t]*(?:type=\w+|\w+_\w+)|biome-ignore(?:-all|-start)?(?:[ \t]+[^\s:*]+)?(?::|[ \t]*(?:\*+/)?[ \t]*$)|coverage:ignore-(?:file|line|start)\b|cognitive_complexity:ignore(?:_for_file)?\b|@ts-(?:ignore|expect-error|nocheck)\b|shellcheck[ \t]+disable=[\w,]+)'
  reason-above:
    kind: comment
    regex: '(?m)(?:\A|\n)[ \t]*(?:/{2,}|/\*+|\*+|#+)?(?:[ \t]*(?:[^\s]+[ \t]+)*?[^\s\p{L}]*\p{L}[^\s]*(?:[ \t]|$)){4}[^\n]*\z'
    not:
      matches: suppression
  reason-below:
    kind: comment
    regex: '(?m)\A(?:/{2,}|/\*+|#+)?(?:[ \t]*(?:[^\s]+[ \t]+)*?[^\s\p{L}]*\p{L}[^\s]*(?:[ \t]|$)){4}'
    not:
      matches: suppression
rule:
  pattern: $C
  matches: directive
  not:
    any:
      - matches: reason-beside
      - follows:
          stopBy: neighbor
          matches: reason-above
      - all:
          - nthChild: 1
          - inside:
              kind: program
              stopBy: neighbor
          - precedes:
              stopBy: neighbor
              matches: reason-below
transform:
  DIRECTIVE:
    replace:
      source: $C
      replace: '(?s)\A.*?(?m:^)[ \t]*#+[ \t]*(shellcheck[ \t]+disable=[\w,]+).*\z'
      by: "$1"
message: 'unexplained suppression "$DIRECTIVE": give its reason in 4 or more words on the same line or on the comment line above'

name: emotely_web
description: The emotely landing page (getemotely.com), a static Jaspr site.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.6.0
  jaspr: ^0.23.5
  jaspr_router: ^0.9.0
  # Jaspr's VM-safe facade over package:web, so @client files compile on
  # the server too.
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.0
  # jaspr_builder 0.23 pins analyzer ^12; build_web_compilers 4.8.6+ wants
  # analyzer 13+, so the compiler stays one patch behind the template default.
  build_web_compilers: ^4.8.5
  flutter_agent_lints: ^1.1.0
  html: ^0.15.7
  jaspr_builder: ^0.23.4
  jaspr_test: ^0.23.4
  test: ^1.31.1
jaspr:
  mode: static

# The journal's own strings (ADR 0020). Every package that shows text has one
# of these; only the names differ. Regenerate with `flutter gen-l10n` here, or
# `melos run l10n:check` to regenerate and verify every package in scope.
arb-dir: l10n
template-arb-file: journal_en.arb
output-dir: lib/src/l10n
output-localization-file: journal_localizations.dart
output-class: JournalLocalizations
# English first: Flutter falls back to the first supported locale when the
# device speaks none of them, and the default order is alphabetical.
preferred-supported-locales: [en]
nullable-getter: false
required-resource-attributes: true
format: true
untranslated-messages-file: build/l10n_untranslated.json
# The generated files are covered by the tests of the screens that show the
# strings, one locale at a time; the rest answers to its generator. The
# coverage marker accepts no punctuation after it, so its reason sits below.
header: |-
  // coverage:ignore-file
  // Generated by flutter gen-l10n from the ARB files in l10n (ADR 0020), so
  // the tests of the screens that show each string cover it, not this file.

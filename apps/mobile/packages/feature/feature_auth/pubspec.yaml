name: feature_auth
description: Who is signed in, and the email-code sign-in that gets there (a password for the stores' review accounts).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analytics: any
  crypto: 3.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: 3.1.0
  get_it: 9.2.1
  go_router: 18.0.1
  google_sign_in: 7.2.0
  legal_links: any
  material_ui: ^1.1.0
  profile_repository: any
  # The method last used to sign in stays on the device, to tag it on the
  # sign-in screen (#204), in the store the usage-analytics choice uses.
  shared_preferences: 2.5.5
  sign_in_with_apple: 8.2.0
  supabase_flutter: 3.0.0-dev.7

dev_dependencies:
  analysis: any
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  go_router_builder: 4.5.0
  shared_preferences_platform_interface: 2.4.2
  testing: any

flutter:
  # Google's own sign-in button (the "G" may not be redrawn), from its
  # branding assets; 2.0x-4.0x variants sit in subdirectories.
  assets:
    - assets/google/

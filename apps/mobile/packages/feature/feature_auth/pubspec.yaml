name: feature_auth
description: Who is signed in, and the email-code sign-in that gets there (a password for the stores' review accounts).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analytics: any
  crypto: 3.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # The generated localizations import it; the SDK pins the intl it needs.
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.1.0
  get_it: 9.2.1
  go_router: 18.0.1
  google_sign_in: 7.2.0
  # The version flutter_localizations requires (^0.20.3), pinned.
  intl: 0.20.3
  legal_links: any
  material_ui: ^1.1.0
  profile_repository: any
  # The method last used to sign in stays on the device, to tag it on the
  # sign-in screen (#204), in the store the usage-analytics choice uses.
  shared_preferences: 2.5.5
  sign_in_with_apple: 8.2.0
  supabase_flutter: 3.0.0-dev.7

dev_dependencies:
  analysis: any
  build_runner: 2.16.1
  # Typed accessors for the package's assets (lib/src/gen/assets.gen.dart),
  # never a path in a string: build_runner writes them with the rest.
  flutter_gen_runner: 5.15.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  go_router_builder: 4.5.0
  shared_preferences_platform_interface: 2.4.2
  testing: any

flutter:
  # gen-l10n: the feature's own strings, from l10n/ (l10n.yaml, ADR 0020).
  generate: true

  # Google's standard "G" (it may not be redrawn or recolored), cropped
  # from its branding assets; 2.0x-4.0x variants sit in subdirectories.
  assets:
    - assets/google/

# flutter_gen_runner: the assets above as typed accessors. The package
# parameter makes `Assets.google.g.image()` load from this package wherever
# the app shows it. Assets only: no fonts or colors are declared here.
flutter_gen:
  output: lib/src/gen/
  assets:
    outputs:
      package_parameter_enabled: true
  fonts:
    enabled: false
  colors:
    enabled: false

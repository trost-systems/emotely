name: feature_onboarding
description: Onboarding before sign-up — welcome, what emotely gives, the name to be called by and the greeting — kept on the device until the account exists.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analytics: any
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: 3.1.0
  get_it: 9.2.1
  go_router: 18.0.1
  material_ui: ^1.1.0
  profile_repository: any
  # The progress through onboarding lives on the device until an account
  # exists (#204, ADR 0019), in the store the usage-analytics choice uses.
  shared_preferences: 2.5.5

dev_dependencies:
  analysis: any
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  go_router_builder: 4.5.0
  shared_preferences_platform_interface: 2.4.2
  supabase_flutter: 3.0.0-dev.7
  testing: any

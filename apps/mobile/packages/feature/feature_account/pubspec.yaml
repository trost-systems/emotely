name: feature_account
description: The account screen and the explicit consent it manages — asked before the first session, withdrawable in one tap, and account deletion.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analytics: any
  consent_repository: any
  feedback_link: any
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # The generated localizations import it; the SDK pins the intl it needs.
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.1.0
  get_it: 9.3.0
  go_router: 18.0.2
  # The version flutter_localizations requires (^0.20.3), pinned.
  intl: 0.20.3
  legal_links: any
  material_ui: ^1.1.0
  profile_repository: any
  supabase_flutter: 3.0.0-dev.7

dev_dependencies:
  analysis: any
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  go_router_builder: 4.5.0
  testing: any

# The following section is specific to Flutter packages.
flutter:
  # gen-l10n: the feature's own strings, from l10n/ (l10n.yaml, ADR 0020).
  generate: true

name: feature_session
description: One journaling session — the agent asks, the user answers in the matching widget, the entry appears at the end.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  agent_client: any
  analytics: any
  contract: any
  design_system: any
  # The emoji picker the legacy app shipped, at its current major; it still
  # builds on package:flutter/material.dart, which is why it is shown under
  # a MaterialUiCompatibilityBridge (see emoji_input.dart), and why its
  # search is our own (emoji_search.dart).
  emoji_picker_flutter: 4.5.4
  # The color picker: hue wheel plus Material swatches, built on
  # material_ui like the rest of the app (the legacy flutter_colorpicker
  # was last released in 2024 and predates the split).
  flex_color_picker: 4.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # The generated localizations import it; the SDK pins the intl it needs.
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.1.0
  get_it: 9.3.0
  go_router: 18.0.2
  # The version flutter_localizations requires (^0.20.3), pinned.
  intl: 0.20.3
  journal_repository: any
  material_ui: ^1.1.0

dev_dependencies:
  analysis: any
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  go_router_builder: 4.5.0
  http: 1.6.0
  # The emoji picker keeps its recents in shared_preferences; tests seed it
  # so the picker can load without a platform channel.
  shared_preferences: 2.5.5
  supabase_flutter: 3.0.0-dev.7
  testing: any

flutter:
  # gen-l10n: the session's own strings, from l10n/ (l10n.yaml, ADR 0020).
  generate: true

  # The slots and the picker dialog draw Material icons.
  uses-material-design: true

name: journal_repository
description: Journal rows — sessions in progress and filed entries — read and written straight from Supabase under the user's own rights (ADR 0010).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  agent_client: any
  contract: any
  flutter:
    sdk: flutter
  freezed_annotation: 3.1.0
  get_it: 9.2.1
  json_annotation: 4.12.0
  supabase_flutter: 3.0.0-dev.7
  supabase_schema: any

dev_dependencies:
  analysis: any
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.1
  json_serializable: 6.14.1
  testing: any

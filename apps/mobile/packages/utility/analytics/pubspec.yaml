name: analytics
description: PostHog product analytics and error tracking, content-free by construction (ADR 0004, ADR 0005).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  agent_client: any
  contract: any
  flutter:
    sdk: flutter
  get_it: 9.2.1
  http: 1.6.0
  meta: ^1.19.0
  posthog_flutter: 5.39.0
  # The usage-analytics choice lives on the device until an account exists
  # (#204); the async API reads the platform store directly, no cache.
  shared_preferences: 2.5.5
  supabase_flutter: 3.0.0-dev.7

dev_dependencies:
  analysis: any
  flutter_test:
    sdk: flutter
  mockito: 5.8.1
  shared_preferences_platform_interface: 2.4.2
  testing: any

# The one analyzer configuration for every package under apps/mobile,
# included by the workspace root's apps/mobile/analysis_options.yaml.
# Packages have no options file of their own (that file says why).
#
# Policy: deny-by-default lints (see AGENTS.md). flutter_agent_lints decides
# every SDK rule as an error or an explicitly reasoned `false`; the
# experimental variant adds the rules the SDK still marks experimental
# (primary constructors among them). Every override below must carry a
# justification. CI runs `dart analyze --fatal-infos` over the packages in
# scope, once: `flutter analyze` does not report analyzer plugins'
# diagnostics (flutter/flutter#187999).
#
# plugins.yaml adds emotely's own rules (tools/emotely_lints). It is a file
# of its own because the analyzer only honors `plugins:` from the
# workspace root's options (apps/mobile/analysis_options.yaml), and warns
# about it in any other file named analysis_options.yaml; reached through an
# include it is honored and silent.
include:
  - package:flutter_agent_lints/experimental.yaml
  - plugins.yaml

analyzer:
  exclude:
    - build/**
  errors:
    # freezed places @JsonSerializable / @JsonKey on factory constructors
    # and parameters by design (its README asks for exactly this override);
    # the annotations are read by the generator, not the analyzer.
    invalid_annotation_target: ignore

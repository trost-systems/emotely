name: design_system
description: The emotely look — theme, and the widgets more than one feature renders (a filed entry, color-coded text).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  agent_client: any
  contract: any
  flutter:
    sdk: flutter
  # The generated localizations import it; the SDK pins the intl it needs.
  flutter_localizations:
    sdk: flutter
  # The version flutter_localizations requires (^0.20.3), pinned.
  intl: 0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  analysis: any
  flutter_test:
    sdk: flutter
  testing: any

flutter:
  # gen-l10n: the words the components say themselves, from l10n/ (l10n.yaml,
  # ADR 0020).
  generate: true

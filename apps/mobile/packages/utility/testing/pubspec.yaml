name: testing
description: Test support shared by every package — the a11y bar, scripted Supabase, spies and the generated mocks.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # The utilities whose test doubles live here. They dev-depend on this
  # package in turn for their own tests; pub allows the cycle, and it never
  # reaches a shipped build because this package is only ever a dev dependency.
  agent_client: any
  analytics: any
  consent_repository: any
  contract: any
  design_system: any
  feedback_link: any
  # The color picker the session feature shows; the helper that taps its
  # swatches lives here so the feature's robot and the live smoke share it.
  flex_color_picker: 4.0.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  get_it: 9.2.1
  go_router: 18.0.1
  # The two sign-in plugins, faked at their platform interfaces like
  # url_launcher (the Apple one sorts further down).
  google_sign_in_platform_interface: 3.1.0
  http: 1.6.0
  journal_repository: any
  material_ui: ^1.1.0
  mockito: 5.8.1
  plugin_platform_interface: 2.1.8
  posthog_flutter: 5.39.0
  profile_repository: any
  # The in-memory store the usage-analytics choice is kept in under test.
  shared_preferences: 2.5.5
  shared_preferences_platform_interface: 2.4.2
  sign_in_with_apple_platform_interface: 2.0.0
  supabase_flutter: 3.0.0-dev.7
  url_launcher_platform_interface: 2.3.2

dev_dependencies:
  analysis: any
  build_runner: 2.16.1

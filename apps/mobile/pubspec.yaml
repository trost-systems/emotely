# The pub workspace for the Flutter client: the app plus its own packages,
# resolved together into one pubspec.lock and one package_config.json here.
# Layering (ADR 0015): utilities depend only on utilities, features only on
# utilities, the app is the glue that composes features.
name: mobile
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  # Every package under the two tiers, picked up by glob (pub supports
  # them since Dart 3.11; melos matches its workspace by the same globs),
  # so adding a package is a directory, not a list entry.
  - app
  - packages/utility/*
  - packages/feature/*

# Sorted, like every pubspec: since apps/mobile/analysis_options.yaml exists
# (the analyzer plugin needs it), this file is linted too.
dev_dependencies:
  # The complexity gate and the clone finder (kevmoo/analytica.dart). Pinned
  # to a commit of main rather than pub.dev: the published releases lag it
  # and lack the line limits the gate uses and the skipping of generated
  # files both tools rely on. Move all three refs (and the override below)
  # together, to a release once one carries those.
  cognitive_complexity:
    git:
      url: https://github.com/kevmoo/analytica.dart
      path: packages/cognitive_complexity
      ref: 103ba839d3d8e4e53853fad600cbde341b153192
  dedupe:
    git:
      url: https://github.com/kevmoo/analytica.dart
      path: packages/dedupe
      ref: 103ba839d3d8e4e53853fad600cbde341b153192
  # melos reads the workspace list above; it only recognizes the workspace
  # when it is declared here, and its configuration lives in the `melos` key.
  melos: 8.7.0

# Both tools want their shared library at a version only main has; pub treats
# a git and a hosted source as different packages, so it has to be overridden
# to the same commit.
dependency_overrides:
  analytica:
    git:
      url: https://github.com/kevmoo/analytica.dart
      path: packages/analytica
      ref: 103ba839d3d8e4e53853fad600cbde341b153192

# `melos run <script>`. Every gate but codegen:check and analyze runs per
# package, in that package's directory. EMOTELY_SCOPE narrows a run to the
# packages that changed plus their dependents (CI sets it on pull requests,
# e.g. `--diff=origin/main...HEAD --include-dependents`); unset, every
# package runs.
melos:
  scripts:
    codegen:check:
      description: Committed generated code (freezed, json_serializable, go_router_builder, mockito, flutter_gen) must match its source, in every package.
      # One build over the whole workspace (build_runner's --workspace), not
      # one per package: each build spends ~26 s on CI compiling the same
      # builders before it writes its 1-9 files, so eleven of them took
      # 6m46s and one takes well under a minute. Each package's build.yaml
      # still applies, and --only-check fails on any stale, missing or extra
      # file in any package. It is skipped only when nothing in scope runs
      # build_runner; otherwise it checks every package, which costs no more
      # than checking one.
      # flutter_gen_runner writes its files itself, past build_runner, so
      # --only-check neither sees nor stops it: a stale assets.gen.dart is
      # silently rewritten and the build passes. The working tree before
      # and after the build is compared instead, and any file the build
      # changed fails the check.
      run: |
        if [ -z "$(melos list --parsable --depends-on=build_runner $EMOTELY_SCOPE)" ]; then
          echo "No package in scope runs build_runner."
          exit 0
        fi
        snapshot() { { git status --porcelain --untracked-files=all -- .; git diff --binary -- .; } | git hash-object --stdin; }
        before=$(snapshot)
        status=0
        dart run build_runner build --workspace --only-check || status=$?
        if [ "$(snapshot)" != "$before" ]; then
          echo "The build rewrote files it should only have checked; commit what it wrote:"
          git status --short -- .
          status=1
        fi
        exit "$status"
    l10n:check:
      description: Committed gen-l10n output must match the ARB files, and every locale must carry every message (ADR 0020).
      # From each package directory; the script lives with the repo's other
      # shell scripts, where CI lints and tests it.
      run: melos exec --fail-fast --concurrency=1 --file-exists=l10n.yaml $EMOTELY_SCOPE -- bash '$MELOS_ROOT_PATH/../../scripts/l10n-check.sh'
    format:
      description: dart format, failing on any change.
      run: melos exec --fail-fast $EMOTELY_SCOPE -- dart format --set-exit-if-changed .
    analyze:
      description: dart analyze with infos fatal, against the workspace rule set and emotely's own analyzer plugin.
      # `dart`, not `flutter analyze`: the latter reports none of an analyzer
      # plugin's diagnostics (flutter/flutter#187999), so tools/emotely_lints
      # would pass unseen. One run over every package in scope, not one per
      # package: each run starts the plugin, and parallel starts would race
      # on its build folder.
      run: dart analyze --fatal-infos $(melos list --parsable $EMOTELY_SCOPE)
    test:
      description: The suite with the hard 100% coverage gate on hand-written code; packages without a test/ directory (analysis, testing) are not measured.
      # One package at a time, measured (#272): the tests are CPU-bound, and
      # four at a time on CI's 4-core runner took 3m27s against 4m08s. CI
      # spreads the packages over runners instead. Parallel runs also race
      # on mason's shared cache (~/.mason-cache), where very_good compiles
      # its test optimizer on first use (a PathNotFoundException in CI); a
      # cache per package avoids it but compiles it again in each, ~9 s.
      run: melos exec --fail-fast --concurrency=1 --dir-exists=test $EMOTELY_SCOPE -- dart pub global run very_good_cli:very_good test --coverage --min-coverage 100 --exclude-coverage "'**/*.{freezed,g,gen,mocks}.dart'"
    schema:generate:
      description: Typed Supabase tables for every repository (the supabase_schema package), generated from the running local database (`supabase db start` first, from the repo root).
      # supabase_typegen defaults to importing package:postgrest, which the
      # package does not depend on; supabase_flutter re-exports the same types.
      run: melos exec --scope=supabase_schema -- dart run supabase_typegen --local --output lib/src/supabase_schema.g.dart --import package:supabase_flutter/supabase_flutter.dart
    complexity:
      description: Per function in lib/, cognitive complexity at most 15 and at most 60 lines; per file at most 400 lines. Generated files and tests are exempt. Lists every function from 10 up; violations are always listed.
      # The target is absolute because the tool changes directory to
      # $GITHUB_WORKSPACE (the repo root) whenever that is set, as it is in CI,
      # so a relative `lib` would miss. Single quotes defer the expansion to
      # each package's run. The tool knows generated files only by their
      # name (*.g.dart and the like), so gen-l10n's output is excluded by
      # its own (ADR 0020). Quoted twice: melos hands the command to a shell
      # again in each package, and there the bare glob would expand to the
      # app's own lib/l10n files.
      run: melos exec --fail-fast --dir-exists=lib $EMOTELY_SCOPE -- dart run cognitive_complexity --threshold 10 --fail-threshold 15 --max-function-lines 60 --max-file-lines 400 --exclude "'**/l10n/*_localizations*.dart'" '$MELOS_PACKAGE_PATH/lib'
    checks:
      description: Every gate but the tests, in the order CI runs them.
      run: melos run codegen:check && melos run l10n:check && melos run format && melos run analyze && melos run complexity
    ci:
      description: Everything the CI app job runs. CI runs the checks and the tests on separate runners, the tests split between them by package.
      run: melos run checks && melos run test

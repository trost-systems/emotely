# The performance budget (#169): what the three main paths in
# perf_test.dart may cost, and the measurements the limits come from.
# `.claude/skills/run-app/scripts/perf.sh gate` judges a run against it; the
# nightly workflow (.github/workflows/nightly-perf.yml) runs it on
# `github-emulator`, and `perf.sh run` runs it here on `local-emulator`.
#
# Changing a number here is a reviewed decision, like any other code: say
# in the pull request what got slower or faster and why.

frames:
  # 60 fps is the floor that fails the run: the p90 of build and of raster
  # each at most 16.7 ms, and under 1% of frames over it.
  floor_ms: 16.7
  max_missed_percent: 1
  # 120 fps is the target: reported as a warning. Once every baseline holds
  # it, it becomes the floor (set floor_ms to 8.3).
  target_ms: 8.3
  # A baseline tightens the floor: each p90 limit is the lower of the floor
  # and the baseline plus this headroom, so a path that is fast today
  # cannot get slower unnoticed while it stays under 16.7 ms.
  headroom_percent: 20
  # "Under 1%" allows no miss at all below 100 frames; a path that draws
  # fewer measures nothing. Each path repeats its gesture to draw more.
  min_frames: 100

# Requests per path and service, against the in-process fake backend, so the
# counts are exact. Any increase fails the run; a decrease passes and says
# to lower the number here. `config` is the agent's /api/config, asked once
# per launch.
requests:
  # Launch signed in onto the journal of 300 made-up entries, then fling to
  # its end and back.
  journal_scroll:
    config: 1
    supabase: 2 # the entries, the open session
  # Open the newest entry and go back, 12 times.
  entry_open:
    supabase: 12 # the entry, each time
  # Start a session and answer 16 rating questions.
  session_round:
    supabase: 19 # consent check, clear + create the session, 16 saved rounds
    agent: 17 # the first round, then one per answer

# The deployed backend, measured from the runner as the smoke account
# (`perf.sh latency`): loose ceilings for the beta, to tighten later. The
# whole agent round is bound by the model: tracked, not gated. The agent
# answers a round in one piece, so its first byte is most of the round.
latency:
  supabase_read_p95_ms: 1000 # a journal read, an entry read
  agent_first_byte_p95_ms: 5000

# Where a run measured, and what it measured there before. A baseline is the
# slowest p90 over five runs (`perf.sh baseline <run>...`), so it covers the
# run-to-run noise; `measured` holds each run's p90 behind it.
#
# On an emulator the 60 fps floor measures the host, not the app, so there
# it is reported and never gated (`floor: reported`), and only the build
# p90 against the baseline plus 20% gates, with the request counts:
# - raster runs through the host's graphics stack: 80-160 ms p90 under the
#   runner's software renderer, a 16.7 ms swap on a Mac, never a phone's GPU;
# - a shared host stalls the emulator now and then (single frames of
#   50-120 ms), which alone breaks "under 1%": the runner missed 1.5-11%;
# - the runner's build p90 swings 1.5x from one runner to the next, up to
#   17.2 ms on the journal scroll, over the floor on its own.
# A phone gates the whole floor.
environments:
  # The nightly: GitHub's ubuntu-latest runner, Android 34 x86_64 emulator
  # under KVM, SwiftShader. Five runners side by side, 2026-09-26, commit
  # c5957d5: https://github.com/trost-systems/emotely/actions/runs/36267427425
  github-emulator:
    raster: reported
    floor: reported
    baseline:
      journal_scroll:
        build_p90_ms: 17.219 # limit 20.663
        raster_p90_ms: 86.856
        measured:
          build_p90_ms: [11.976, 11.131, 17.219, 13.241, 16.715]
          raster_p90_ms: [79.456, 80.624, 86.856, 77.547, 85.478]
      entry_open:
        build_p90_ms: 12.576 # limit 15.091
        raster_p90_ms: 159.758
        measured:
          build_p90_ms: [11.08, 8.686, 11.915, 8.42, 12.576]
          raster_p90_ms: [141.686, 135.723, 155.612, 140.596, 159.758]
      session_round:
        build_p90_ms: 8.698 # limit 10.438
        raster_p90_ms: 72.947
        measured:
          build_p90_ms: [4.651, 5.207, 8.05, 4.912, 8.698]
          raster_p90_ms: [62.765, 66.203, 70.334, 65.304, 72.947]
  # `perf.sh run` without --device: a fresh Android 34 arm64 emulator with
  # the host GPU. Five runs, 2026-09-26, commit c5957d5, on an Apple M4 Pro
  # with other agent sessions busy beside it. A slower machine may need its
  # own baseline.
  local-emulator:
    raster: reported
    floor: reported
    baseline:
      journal_scroll:
        build_p90_ms: 3.196 # limit 3.835
        raster_p90_ms: 17.316
        measured:
          build_p90_ms: [2.585, 2.501, 3.196, 2.887, 2.851]
          raster_p90_ms: [2.362, 16.619, 4.61, 16.989, 17.316]
      entry_open:
        build_p90_ms: 2.49 # limit 2.988
        raster_p90_ms: 17.45
        measured:
          build_p90_ms: [1.947, 2.229, 2.366, 2.49, 2.092]
          raster_p90_ms: [17.355, 17.256, 17.369, 17.21, 17.45]
      session_round:
        build_p90_ms: 1.632 # limit 1.958
        raster_p90_ms: 17.27
        measured:
          build_p90_ms: [1.51, 1.465, 1.57, 1.632, 1.564]
          raster_p90_ms: [1.766, 16.722, 16.454, 17.27, 17.071]
  # A phone (`perf.sh run --device <id>`): frames as users get them, and
  # the whole floor gates. No baseline yet: the floor alone.
  device:
    raster: gated
    baseline: {}

# The performance budget (#169): what the three main paths in
# perf_test.dart may cost, and the measurements the limits come from.
# `.claude/skills/run-app/scripts/perf.sh gate` judges a run against it; the
# nightly workflow (.github/workflows/nightly-perf.yml) runs it on
# `github-emulator`, and `perf.sh run` runs it here on `local-emulator`.
#
# Changing a number here is a reviewed decision, like any other code: say
# in the pull request what got slower or faster and why.

frames:
  # 60 fps is the floor that fails the run: the p90 of build and of raster
  # each at most 16.7 ms, and under 1% of frames over it.
  floor_ms: 16.7
  max_missed_percent: 1
  # 120 fps is the target: reported as a warning. Once every baseline holds
  # it, it becomes the floor (set floor_ms to 8.3).
  target_ms: 8.3
  # A baseline tightens the floor: each p90 limit is the lower of the floor
  # and the baseline plus this headroom, so a path that is fast today
  # cannot get slower unnoticed while it stays under 16.7 ms.
  headroom_percent: 20
  # "Under 1%" allows no miss at all below 100 frames; a path that draws
  # fewer measures nothing. Each path repeats its gesture to draw ~250.
  min_frames: 100

# Requests per path and service, against the in-process fake backend, so the
# counts are exact. Any increase fails the run; a decrease passes and says
# to lower the number here. `config` is the agent's /api/config, asked once
# per launch.
requests:
  # Launch signed in onto the journal of 300 made-up entries, then fling to
  # its end and back three times.
  journal_scroll:
    config: 1
    supabase: 2 # the entries, the open session
  # Open the newest entry and go back, 8 times.
  entry_open:
    supabase: 8 # the entry, each time
  # Start a session and answer 8 rating questions.
  session_round:
    supabase: 11 # consent check, clear + create the session, 8 saved rounds
    agent: 9 # the first round, then one per answer

# The deployed backend, measured from the runner as the smoke account
# (`perf.sh latency`): loose ceilings for the beta, to tighten later. The
# whole agent round is bound by the model: tracked, not gated. The agent
# answers a round in one piece, so its first byte is most of the round.
latency:
  supabase_read_p95_ms: 1000 # a journal read, an entry read
  agent_first_byte_p95_ms: 5000

# Where a run measured, and what it measured there before. A baseline is the
# slowest p90 over several runs (`perf.sh baseline <run>...`), which covers
# the run-to-run noise; a path without one is held to the floor alone.
environments:
  # The nightly: GitHub's ubuntu-latest runner, Android 34 x86_64 emulator
  # under KVM, software rendering (SwiftShader).
  github-emulator:
    # An emulator rasterises through the host's graphics stack, so its
    # raster times say nothing about a phone's: reported, never gated.
    raster: reported
    baseline: {}
  # `perf.sh run` without --device: a fresh Android 34 arm64 emulator with
  # the host GPU, measured on an Apple M4 Pro. A slower machine may need
  # its own baseline.
  local-emulator:
    raster: reported
    baseline: {}
  # A phone (`perf.sh run --device <id>`): frames as users get them, raster
  # included. No baseline yet: the floor alone.
  device:
    raster: gated
    baseline: {}

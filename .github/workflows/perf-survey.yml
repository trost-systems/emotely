name: Performance survey

# The performance survey (#242): every screen of the feature map walked in
# profile mode on real phones in Firebase Test Lab, each run's numbers
# appended to the history (the perf-survey branch), and findings filed as
# one issue per screen and metric, by severity. It runs on demand, never
# on a schedule (decided 2026-10-03: emotely does not change often enough
# to measure every night). The walk, the devices and
# the severity rules: apps/mobile/app/integration_test/survey_test.dart and
# survey.yaml; the reference: .claude/skills/run-app/references/
# performance-survey.md. The performance budget (#169) is the rest: every
# pull request holds its request counts (a widget test in CI), and
# nightly-perf.yml runs its three paths on emulators (frames, latency and
# request counts, reported). Frames on real phones are this workflow's.
#
# Cost: none. The Firebase project emotely-ci is on the Spark plan with no
# billing account: 5 physical and 10 virtual test runs a day, shared by
# every run in the project. A full survey spends 2 physical runs (the
# devices survey.yaml marks `default: true`), leaving 3 for ad-hoc runs.
#
# Sign-in is keyless (Workload Identity Federation): the service account
# ftl-runner holds Test Lab admin, analytics viewer and Editor on the
# project: it uploads to and reads Test Lab's own results bucket, which
# cannot be granted on its own. The project holds nothing but Test Lab and
# has no billing, and only this repository can sign in as the runner.

on:
  # Two kinds of run, both by hand (`gh workflow run perf-survey.yml --ref
  # main ...`):
  # - a full survey: no device and no screens. Every screen on the default
  #   devices; it files or updates the findings' issues, and its records
  #   are the baselines later runs are judged against.
  # - an ad-hoc run: one device, or some screens. Judged against those
  #   baselines and kept in the history, never part of a baseline; it files
  #   nothing unless given an issue_tag.
  workflow_dispatch:
    inputs:
      device:
        description: >-
          One device: a key of survey.yaml's devices or <model>:<version>
          (Test Lab ids). Empty: survey.yaml's default devices.
        default: ""
      screens:
        description: "The screens to walk, comma-separated; empty walks them all."
        default: ""
      issue_tag:
        description: >-
          File or update issues for this ad-hoc run, with this tag after the
          severity (e.g. "[test #242]"). Empty: an ad-hoc run files nothing.
        default: ""
  # A change to the survey proves it still builds and its data side still
  # passes: no Test Lab run, no quota.
  pull_request:
    paths:
      - apps/mobile/app/integration_test/survey_test.dart
      - apps/mobile/app/integration_test/survey/**
      - apps/mobile/app/integration_test/survey.yaml
      - apps/mobile/app/android/app/src/androidTest/**
      - .claude/skills/run-app/scripts/survey*
      - .github/workflows/perf-survey.yml

# Never cancel a run: a Test Lab run that started counts against the
# quota whether or not anyone waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SURVEY: .claude/skills/run-app/scripts/survey.sh

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          DEVICE: ${{ inputs.device }}
          SCREENS: ${{ inputs.screens }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            devices='[]'
            kind="pr"
          elif [[ -n "${DEVICE:-}" ]]; then
            # One device, listed or not: survey.sh looks up the rest.
            devices="$(yq -o json apps/mobile/app/integration_test/survey.yaml | jq -c --arg d "$DEVICE" '
              [.devices | to_entries[] | select(.key == $d or "\(.value.model):\(.value.version)" == $d)
               | {key} + .value] | if length > 0 then . else [{key: $d, platform: "android"}] end')"
            kind="adhoc"
          else
            devices="$(bash "$SURVEY" plan)"
            # Every screen of the default devices is a full survey; some of
            # them is an ad-hoc run.
            if [[ -n "${SCREENS:-}" ]]; then kind="adhoc"; else kind="survey"; fi
          fi
          {
            echo "android=$(jq -c 'map(select(.platform == "android"))' <<<"$devices")"
            echo "ios=$(jq -c 'map(select(.platform == "ios"))' <<<"$devices")"
            echo "source=$kind"
          } >>"$GITHUB_OUTPUT"
          echo "Devices: $devices ($kind)" >>"$GITHUB_STEP_SUMMARY"

  # The data side, test-first (survey.test.sh), and the Android build: on
  # every run, pull requests included.
  android-build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash .claude/skills/run-app/scripts/survey.test.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: bash "$SURVEY" build android --screens "${{ inputs.screens }}" --out "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: survey-android-build
          path: |
            ${{ runner.temp }}/build/app.apk
            ${{ runner.temp }}/build/test.apk
          retention-days: 3

  android:
    needs: [plan, android-build]
    if: needs.plan.outputs.android != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: survey-android-build
          path: build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.FTL_PROJECT_ID }}
          workload_identity_provider: ${{ vars.FTL_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FTL_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Survey on Test Lab
        env:
          FTL_PROJECT_ID: ${{ vars.FTL_PROJECT_ID }}
        run: >-
          bash "$SURVEY" ftl --device "${{ matrix.device.key }}" --screens "${{ inputs.screens }}"
          --app build/app.apk --test build/test.apk --source "${{ needs.plan.outputs.source }}"
          --no-judge --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: survey-${{ matrix.device.key }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  # iOS needs match's App Store certificate and profile, which live in the
  # `release` environment: it deploys from main only, so this job runs on
  # the schedule and on dispatches of main. Test Lab re-signs the build.
  ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.ios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - run: flutter pub get
        working-directory: apps/mobile
      - run: bundle exec fastlane ios survey_signing
        working-directory: apps/mobile/app
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - run: bash "$SURVEY" build ios --screens "${{ inputs.screens }}" --out "$RUNNER_TEMP/build"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.FTL_PROJECT_ID }}
          workload_identity_provider: ${{ vars.FTL_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FTL_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: beta
      - name: Survey on Test Lab
        env:
          FTL_PROJECT_ID: ${{ vars.FTL_PROJECT_ID }}
        run: >-
          bash "$SURVEY" ftl --device "${{ matrix.device.key }}" --screens "${{ inputs.screens }}"
          --zip "$RUNNER_TEMP/build/survey-ios.zip" --source "${{ needs.plan.outputs.source }}"
          --no-judge --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: survey-${{ matrix.device.key }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  # Judges the run against the history, files or updates the issues, and
  # appends the run to the history. Whatever devices got through.
  report:
    needs: [plan, android, ios]
    if: >-
      !cancelled() && needs.plan.outputs.source != 'pr' &&
      (needs.android.result == 'success' || needs.android.result == 'failure' ||
       needs.ios.result == 'success' || needs.ios.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: survey-*
          path: runs
      - name: Judge, file, keep
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.plan.outputs.source }}
          ISSUE_TAG: ${{ inputs.issue_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat runs/*/records.jsonl >run.jsonl 2>/dev/null || true
          if [[ ! -s run.jsonl ]]; then
            echo "No device reported a survey." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Before the append: the run is judged against what came before.
          bash "$SURVEY" classify run.jsonl >findings.json
          if [[ "$SOURCE" == survey || -n "${ISSUE_TAG:-}" ]]; then
            bash "$SURVEY" issues findings.json --run-url "$RUN_URL" ${ISSUE_TAG:+--tag "$ISSUE_TAG"}
          fi
          bash "$SURVEY" append run.jsonl
          {
            echo '```'
            bash "$SURVEY" history --from run.jsonl --days 36500
            echo '```'
            echo
            echo "Findings: $(jq -r 'map("\(.severity) \(.key)") | join(", ") | if . == "" then "none" else . end' findings.json)"
          } >>"$GITHUB_STEP_SUMMARY"

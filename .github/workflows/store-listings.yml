name: Store listings

# Uploads the App Store and Play listings kept in
# apps/mobile/app/fastlane/metadata (English and German) with the `metadata`
# lanes: listing text, keywords, URLs and categories, and the App Review
# information in apps/mobile/app/fastlane/app_review. No build, no
# screenshots, no release notes, nothing submitted for review.
#
# Runs when a change to the listings reaches main, and by hand:
#
#   gh workflow run store-listings.yml                  # both stores
#   gh workflow run store-listings.yml -f store=play    # one of them
#
# The App Store job skips with a notice while no version can take a listing
# (none in preparation, or Apple reviewing it); app-release uploads it after
# its next iOS build. Play reviews a listing change before it shows, and the
# commit refuses to cancel anything already in review (ERROR_IF_IN_REVIEW,
# fastlane/lib/play_review_guard.rb): such a run fails and is run again once
# the review is done. The `release` environment deploys from `main` only.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app/fastlane/metadata/**'
      # The beta notes (release notes of the alpha track) are not listing
      # text: `fastlane android beta` writes them with the next promotion.
      - '!apps/mobile/app/fastlane/metadata/android/*/changelogs/**'
      - 'apps/mobile/app/fastlane/app_review/**'
  workflow_dispatch:
    inputs:
      store:
        description: Which store's listing to upload.
        type: choice
        options: [both, app-store, play]
        default: both

permissions:
  contents: read

jobs:
  # Store API calls only, so no Xcode, no Flutter, no macOS.
  app-store:
    # On a push there are no inputs, so both jobs run.
    if: inputs.store != 'play'
    runs-on: ubuntu-latest
    environment: release
    # One App Store listing upload at a time, here or in app-release; queued,
    # never dropped.
    concurrency:
      group: app-store-listing
      queue: max
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash ../../../scripts/store-listing-check.sh
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane ios metadata
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}

  play:
    if: inputs.store != 'app-store'
    runs-on: ubuntu-latest
    environment: release
    # The lock every Play writer holds (see app-release.yml): one open edit at
    # a time, queued, never dropped.
    concurrency:
      group: play-writes
      queue: max
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash ../../../scripts/store-listing-check.sh
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane android metadata
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

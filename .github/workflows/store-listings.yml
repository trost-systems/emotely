name: Store listings

# Uploads the App Store and Play listings kept in
# apps/mobile/app/fastlane/metadata (English and German) with the `metadata`
# lanes: listing text, keywords, URLs and categories only. No build, no
# screenshots, no release notes, nothing submitted for review.
#
# Manual only, and never on a merge: a listing is public the moment a store
# accepts it (Play reviews it first), so a person starts this run after the
# pull request that changed the files has merged. The `release` environment
# deploys from `main` only, so what runs is always what main holds.
#
#   gh workflow run store-listings.yml                  # both stores
#   gh workflow run store-listings.yml -f store=play    # one of them
on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store's listing to upload.
        type: choice
        options: [both, app-store, play]
        default: both

# Its own group: sharing app-release's would let this run replace a pending
# release run. The two can still meet on Play, where only one edit commits;
# the loser fails with an edit error and is simply run again.
concurrency:
  group: store-listings
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Store API calls only, so no Xcode, no Flutter, no macOS.
  app-store:
    if: inputs.store != 'play'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash ../../../scripts/store-listing-check.sh
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane ios metadata
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  play:
    if: inputs.store != 'app-store'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash ../../../scripts/store-listing-check.sh
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane android metadata
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

name: CI

on:
  pull_request:
  # The merge queue tests each pull request against what main will be; ci-ok
  # must report here too, or the queue waits forever. Deploy jobs gate on
  # `push` to main, so a queue branch never deploys.
  merge_group:
  push:
    branches: [main]

# Supersede in-flight runs for the same ref; ci-ok stays pending on cancellation.
# Never on main: each push diffs only its own commits, so a canceled (or, in a
# shared group, a replaced pending) run would skip that push's supabase-deploy
# for good, and the merge queue lands pushes back to back. Each push to main
# gets its own group; supabase-deploy serializes itself below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      app: ${{ steps.filter.outputs.app }}
      lints: ${{ steps.filter.outputs.lints }}
      scripts: ${{ steps.filter.outputs.scripts }}
      supabase: ${{ steps.filter.outputs.supabase }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            agent:
              - 'apps/agent/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'biome.jsonc'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            app:
              - 'apps/mobile/**'
              # The analyzer plugin every package's analysis runs.
              - 'tools/emotely_lints/**'
              # The Dart contract is pinned against the emitted JSON Schema.
              - 'packages/contract/contract.schema.json'
              # What `melos run l10n:check` runs in every package.
              - 'scripts/l10n-check.sh'
              - '.github/workflows/ci.yml'
            lints:
              - 'tools/emotely_lints/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.claude/skills/*/scripts/**'
              - '.github/workflows/ci.yml'
            supabase:
              - 'supabase/**'
              # The typed tables generated from the schema, the pin of their
              # generator, and the melos script that runs it with its flags
              # (see the supabase job).
              - 'apps/mobile/packages/utility/supabase_schema/lib/src/supabase_schema.g.dart'
              - 'apps/mobile/packages/utility/supabase_schema/pubspec.yaml'
              - 'apps/mobile/pubspec.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    environment: ci
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      # Contract tripwire: the committed JSON Schema must match the zod source.
      - run: pnpm --filter @emotely/contract schema && git diff --exit-code packages/contract/contract.schema.json
      # Live-model protocol eval (deterministic assertions; judged behavior
      # evals run nightly). Fork PRs have no secrets and skip; anywhere else
      # a missing key is a broken secret and fails loudly. Dependabot runs
      # never see environment secrets, only Dependabot secrets, so theirs is
      # a Dependabot secret of the same name — a dependency bump is exactly
      # what this eval should gate.
      - run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            pnpm --filter @emotely/agent eval
          elif [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "eval skipped: fork PR has no gateway key"
          elif [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "::error::AI_GATEWAY_API_KEY is missing — check the repo's Dependabot secret"
            exit 1
          else
            echo "::error::AI_GATEWAY_API_KEY is missing — check the 'ci' environment secret"
            exit 1
          fi

  # The Flutter workspace (apps/mobile): the app and its packages, each gated
  # on its own — codegen tripwire, format, analyze, and the hard 100% coverage
  # gate on hand-written code (generated files excluded, main.dart carrying a
  # coverage:ignore-file marker). The gates are melos scripts in
  # apps/mobile/pubspec.yaml, so CI and a developer run the same thing.
  # Spread over four runners to stay under five minutes (#272): one runs
  # every gate but the tests (`melos run checks`), three run the tests, each
  # for every third package in scope. The tests are CPU-bound: four
  # packages at a time on one 4-core runner took 3m27s against 4m08s one at
  # a time, so they scale by runners, not by concurrency. Each runner's
  # setup is ~35 s, so a shard of a full run takes about as long as the
  # checks. The matrix job fails if any part fails, which fails ci-ok.
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: app (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      # Every part reports, so one run shows every failing gate.
      fail-fast: false
      matrix:
        # `checks` first: each test shard takes its number from its place
        # after it, and the shard count from the length of this list, so
        # another shard is one more entry here and nothing else.
        part: [checks, tests 1, tests 2, tests 3]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `melos --diff` compares against the base branch, so it needs history.
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      # apps/mobile/analysis_options.yaml is the workspace's only options
      # file: one in a package makes the analyzer plugin resolve the
      # workspace again for it, and the analyze step ten times slower.
      - name: One analysis_options.yaml for the workspace
        if: matrix.part == 'checks'
        run: |
          extra=$(git ls-files -- '*/analysis_options.yaml' | grep -v '^packages/utility/analysis/lib/' || true)
          if [ -n "$extra" ]; then
            echo "::error::Packages take their options from apps/mobile/analysis_options.yaml; remove: $extra"
            exit 1
          fi
      - run: flutter pub get
      # build_runner's compiled builders (an AOT snapshot of the build
      # script), ~26 s to compile on every run otherwise. Only the builders
      # are cached, never generated output or build state: build_runner
      # recompiles the snapshot whenever the MD5 of any of its inputs
      # changes, and codegen:check compares freshly built output with what
      # is committed on every run.
      - if: matrix.part == 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/.dart_tool/build/entrypoint
          key: build-runner-${{ runner.os }}-${{ hashFiles('apps/mobile/app/.fvmrc', 'apps/mobile/pubspec.lock', 'apps/mobile/**/build.yaml') }}
          restore-keys: build-runner-${{ runner.os }}-
      - run: dart pub global activate melos 8.7.0
      # 1.5.0 is the first release whose coverage works inside a workspace
      # member (very_good_cli #1683); older ones crash on the missing local
      # package_config.json.
      - if: startsWith(matrix.part, 'tests')
        run: dart pub global activate very_good_cli 1.5.0
      # On a pull request, run only the packages that changed plus their
      # dependents — unless something outside a package changed (the workspace
      # pubspec or lock, the shared rule set in packages/utility/analysis, the
      # l10n check script, the analyzer plugin in tools/emotely_lints, the
      # contract schema the app is pinned against, this workflow), which
      # affects every package and runs everything. The plugin is wired through
      # analysis_options.yaml, which melos's dependency graph cannot see: a
      # rule changed alone would otherwise be analyzed against no package at
      # all. Merge-queue runs and pushes to main always run everything.
      - name: Scope the gates to what changed
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # `:/` pathspecs resolve from the repo root, not this working directory.
          changed=$(git diff --name-only "$BASE...HEAD" -- \
            :/apps/mobile :/scripts/l10n-check.sh :/tools/emotely_lints \
            :/packages/contract/contract.schema.json :/.github/workflows/ci.yml)
          outside=$(printf '%s\n' "$changed" \
            | grep -vE '^apps/mobile/(app|packages/[^/]+/[^/]+)/' \
            | grep -v '^$' || true)
          shared=$(printf '%s\n' "$changed" \
            | grep '^apps/mobile/packages/utility/analysis/' || true)
          if [ -n "$outside" ] || [ -n "$shared" ]; then
            echo "workspace-wide change; every package runs"
          else
            echo "EMOTELY_SCOPE=--diff=$BASE...HEAD --include-dependents" >> "$GITHUB_ENV"
            echo "scoped to the packages changed since $BASE and their dependents"
          fi
      - if: matrix.part == 'checks'
        run: melos run checks
      # This shard's share of the packages the test gate would run: every
      # n-th one of the list the scope above selects (melos lists them by
      # name), starting at the shard's own number. It replaces the scope
      # with those names, so the shards never overlap and together run
      # exactly the packages one runner would.
      - name: This shard's packages
        if: startsWith(matrix.part, 'tests')
        env:
          SHARD: ${{ strategy.job-index }}
          PARTS: ${{ strategy.job-total }}
        run: |
          shards=$((PARTS - 1))
          mine=$(melos list --json --dir-exists=test $EMOTELY_SCOPE \
            | jq -r --argjson shard "$SHARD" --argjson shards "$shards" \
              '[.[].name] | to_entries | map(select(.key % $shards == $shard - 1) | "--scope=\(.value)") | join(" ")')
          if [ -z "$mine" ]; then
            echo "No package in scope for shard $SHARD of $shards."
            echo "EMOTELY_SHARD_EMPTY=true" >> "$GITHUB_ENV"
          else
            echo "Shard $SHARD of $shards: $mine"
            echo "EMOTELY_SCOPE=$mine" >> "$GITHUB_ENV"
          fi
      - if: startsWith(matrix.part, 'tests') && env.EMOTELY_SHARD_EMPTY != 'true'
        run: melos run test

  # The landing page (apps/web): a Dart-only Jaspr site. Generated
  # *.options.dart files are committed; the build must not change them. The
  # waitlist form is tested in headless Chrome, the rest on the VM, and the
  # static build itself is the last gate.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.3
      - run: dart pub get
      - run: dart pub global activate jaspr_cli 0.23.4
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart test -p chrome test/client
      # --sitemap-exclude matches scripts/vercel-build.sh: /beta and /de/beta are unlisted
      # and must not reach sitemap.xml.
      - run: jaspr build --sitemap-domain https://getemotely.com --sitemap-exclude '^(/de)?/beta$'
      - run: git diff --exit-code -- lib

  # emotely's analyzer plugin (tools/emotely_lints, ADR 0020): its own gates.
  # It is outside the apps/mobile workspace (analyzer_testing and
  # flutter_test pin test_api apart), so it is formatted, analyzed and tested
  # here on its own, with the rule set every package uses, at 100% coverage.
  # The app job above runs the plugin itself over every package.
  lints:
    needs: changes
    if: needs.changes.outputs.lints == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/emotely_lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The same SDK as the app, so the plugin is tested against the analyzer
      # it will run beside.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart pub global activate very_good_cli 1.5.0
      - run: very_good dart test --coverage --min-coverage 100

  # The machine-setup script bootstraps every other job, so it is the one file
  # that has to work where nothing else does yet; the skills' scripts are what
  # agents run to release and to verify. shellcheck is the lint for all of
  # them; runners ship it preinstalled. release-status.sh gates what
  # app-release writes to the public badge file, so its refusals are tested
  # here, before a release depends on them. run-app.sh's account guard and
  # its lock between parallel agent sessions are tested the same way.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck --external-sources --severity=style scripts/*.sh .claude/skills/*/scripts/*.sh
      - run: bash scripts/release-status.test.sh
      - run: bash scripts/l10n-check.test.sh
      - run: bash .claude/skills/run-app/scripts/run-app.test.sh

  # The ast-grep gate (ADR 0018): every rule under ast-grep/rules, over every
  # tracked file. The comment tripwire (ast-grep/rules/tripwire): hand-written
  # Dart, TypeScript and shell must not announce a workaround (TODO, FIXME,
  # HACK, XXX, "workaround", "for now", "temporary") or suppress a diagnostic
  # without a reason; deferred work goes into an issue. The architecture
  # rules (ast-grep/rules/architecture): ADR 0015's boundaries, such as
  # defines read only in an app's environment file. Each checks only what
  # the Dart analyzer and biome do not already fail. `ast-grep.sh test` also
  # fails a rule test whose rule is gone, and the scan fails an ast-grep
  # suppression comment that names no rule (`no-suppress-all`). It installs only the
  # root package, whose ast-grep is a prebuilt binary, and reads every tracked
  # source in well under a second, so it has no paths filter. The copy spell
  # check shares its Node setup and runs last. Rules that need types are not
  # here: they are the analyzer plugin's (tools/emotely_lints), which the app
  # job runs and the lints job tests.
  # The same job keeps the run-app skill's feature map honest: every typed
  # route the Flutter workspace declares (the ast-grep rule `typed-go-route`,
  # off in the scan above; `ast-grep.sh test` still runs its tests) has its
  # entry, and every entry a route. Runners ship jq and yq.
  ast-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter emotely
      - run: pnpm exec bash scripts/ast-grep.sh test
      - run: pnpm exec bash scripts/ast-grep.test.sh
      - run: pnpm exec bash scripts/ast-grep.sh --format github
      - run: pnpm exec bash scripts/feature-map.test.sh
      - run: pnpm exec bash scripts/feature-map.sh
      - run: pnpm exec bash scripts/spell.test.sh
      # The copy spell check (ADR 0020): the app's ARB messages and the
      # agent's question wordings, English and German, and the words
      # CONTEXT.md says to avoid. Then US English everywhere we write:
      # British spellings fail in code, docs, scripts, config and the English
      # ARB files. Offline, about two seconds; every pull request, since
      # words can change anywhere. Both run, so one push shows every finding.
      - run: |
          template='::error file=$filename,line=$row,col=$col::$message: $text'
          status=0
          pnpm spell:copy --issue-template "$template" || status=1
          pnpm spell:us-english --issue-template "$template" || status=1
          exit "$status"

  # The schema gate: migrations apply to a fresh Postgres, and the pgTAP suite
  # proves row-level security holds (ADR 0010). Only the database container
  # is started; nothing else is needed to run SQL tests.
  supabase:
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - run: supabase db start
      - run: supabase test db --local
      - run: supabase db lint --local --fail-on warning
      # The app's typed tables are generated from this database
      # (supabase_typegen); a migration without a regenerated file fails here.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: dart pub global activate melos 8.7.0
      - run: melos run schema:generate
        working-directory: apps/mobile
      - run: git diff --exit-code -- apps/mobile/packages/utility/supabase_schema/lib/src/supabase_schema.g.dart

  # Merging is deploying for the schema too: migrations and auth config go to
  # the hosted project from main, never by hand (ADR 0010). Secrets live in the
  # 'ci' environment; the project ref is a variable there.
  supabase-deploy:
    needs: supabase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ci
    # One deploy at a time, and each deploys main as it is now rather than
    # this run's commit: runs of back-to-back pushes can reach this job out of
    # order, and an older `config push` would revert a newer one. A deploy
    # waiting here may be replaced by a later one, which ships its changes too.
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Resend API key; resolved by `config push` for [remotes.production].
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push
      - run: supabase config push --yes
      # A second push must find nothing left to change. A value the
      # Management API stores differently from config.toml (a comma list it
      # splits, a default it rewrites) would be pushed again on every deploy
      # and never settle; this makes that drift a red deploy, not a surprise.
      - name: Config converged
        run: |
          out=$(supabase config push --yes 2>&1)
          echo "$out"
          for service in API DB Auth; do
            grep -q "Remote $service config is up to date." <<<"$out" || {
              echo "::error::$service config did not converge on a second push"
              exit 1
            }
          done

  # The single required check. Green only if every job succeeded or was skipped.
  ci-ok:
    needs: [changes, agent, app, ast-grep, lints, scripts, supabase, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

name: App release

# Ships the Flutter app to TestFlight and to Play (ADR 0013) in two stages.
#
# Every merge to main that touches the app uploads to the internal stage of
# both stores: the TestFlight `Team` group (it has access to all builds) and
# the Play `internal` track. No outside tester sees those. Both jobs share
# one monotonic build number, and the `status` job records what they
# uploaded for the README badges.
#
# A manual run (workflow_dispatch) is the beta release: it builds nothing and
# promotes a build already on the internal stage — the newest, or the one
# named by `build_number` — to the external TestFlight group `Beta` and the
# closed Play track `alpha`. That is where the waits are: the first build of
# a version goes through Beta App Review (Apple takes one submission per
# version at a time, so the iOS job refuses while one is pending), and Play
# reviews every closed-testing release. Neither wait is inside the run.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          Build number to promote on both stores (e.g. 1027). Empty means the
          newest build on each store's internal stage.
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      # A listing ships through store-listings.yml, not with a build.
      - '!apps/mobile/app/fastlane/metadata/**'
      - '!apps/mobile/app/fastlane/app_review/**'
      - '!apps/mobile/app/fastlane/data_safety.csv'
      - '!apps/mobile/app/fastlane/console/**'
      # The Dart contract is pinned against the emitted JSON Schema.
      - 'packages/contract/contract.schema.json'
      - '.github/workflows/app-release.yml'

concurrency:
  group: app-release
  cancel-in-progress: false

# Read-only by default; only the `status` job, which holds no secret, writes.
permissions:
  contents: read

jobs:
  ios-internal:
    if: github.event_name == 'push'
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26),
    # which this image carries by default.
    runs-on: macos-26
    environment: release
    # What the lane uploaded, for the `status` job.
    outputs:
      version: ${{ steps.lane.outputs.version }}
      build: ${{ steps.lane.outputs.build }}
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      # match pulls the certificate + profile from the private repo.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - run: flutter pub get
      # Monotonic, and above anything the legacy app shipped (ADR 0012).
      # Expressions cannot do arithmetic, hence the shell.
      - run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - id: lane
        run: bundle exec fastlane ios internal
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

  # The App Store listing catches up after every iOS build: a listing that
  # merged while no version could take it (store-listings.yml skipped it)
  # goes up as soon as one is in preparation. Skips with a notice otherwise.
  app-store-listing:
    needs: ios-internal
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: app-store-listing
      queue: max
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane ios metadata
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}

  android-internal:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    # The lock every Play writer holds (also store-listings.yml): Play keeps
    # one open edit per account and any commit invalidates the others, so the
    # writers take turns. `queue: max` keeps every waiting job in order
    # instead of replacing the pending one; the lock goes with the job.
    concurrency:
      group: play-writes
      queue: max
    outputs:
      version: ${{ steps.lane.outputs.version }}
      build: ${{ steps.lane.outputs.build }}
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      # The upload keystore and its key.properties, straight from secrets.
      # key.properties points at ../upload-keystore.jks relative to the app
      # module, i.e. android/upload-keystore.jks.
      - run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      - run: flutter pub get
      - run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - id: lane
        run: bundle exec fastlane android internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

  # Records what the internal jobs uploaded in status.json on the `status` branch (README badges).
  # The only job that can write: keep it free of secrets, builds and third-party actions.
  status:
    needs: [ios-internal, android-internal]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      (needs.ios-internal.result == 'success' || needs.android-internal.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/release-status.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          IOS_RESULT: ${{ needs.ios-internal.result }}
          IOS_VERSION: ${{ needs.ios-internal.outputs.version }}
          IOS_BUILD: ${{ needs.ios-internal.outputs.build }}
          ANDROID_RESULT: ${{ needs.android-internal.result }}
          ANDROID_VERSION: ${{ needs.android-internal.outputs.version }}
          ANDROID_BUILD: ${{ needs.android-internal.outputs.build }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The branch head, or nothing on the very first run.
          head="$(gh api "repos/${repo}/git/matching-refs/heads/status" \
            --jq '.[] | select(.ref == "refs/heads/status") | .object.sha')"
          if [[ -n "${head}" ]]; then
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${repo}/contents/status.json?ref=${head}" >status.json
          else
            printf '{}\n' >status.json
          fi

          # A job that failed keeps its last badge.
          if [[ "${IOS_RESULT}" == success ]]; then
            scripts/release-status.sh status.json ios internal \
              "${IOS_VERSION}" "${IOS_BUILD}" "${GITHUB_SHA}" "${now}"
          fi
          if [[ "${ANDROID_RESULT}" == success ]]; then
            scripts/release-status.sh status.json android internal \
              "${ANDROID_VERSION}" "${ANDROID_BUILD}" "${GITHUB_SHA}" "${now}"
          fi

          # Vercel deploys every pushed branch, and this one holds none of
          # the Vercel projects' Root Directories, so each push failed as a
          # preview with "Root Directory does not exist". Vercel reads
          # git.deploymentEnabled from the pushed commit's Root Directory,
          # so the branch carries a vercel.json in each that turns
          # deployments off. A new Vercel project needs its root added here.
          tree="$(jq -n --rawfile content status.json '
            {tree: (
              [{path: "status.json", mode: "100644", type: "blob", content: $content}] +
              (["apps/agent", "apps/web"] | map({
                path: "\(.)/vercel.json", mode: "100644", type: "blob",
                content: "{\"git\":{\"deploymentEnabled\":false}}\n"
              }))
            )}' |
            gh api "repos/${repo}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg tree "${tree}" --arg head "${head}" \
            --arg message "internal builds of ${GITHUB_SHA} (app-release run ${GITHUB_RUN_ID})" \
            '{message: $message, tree: $tree, parents: [$head | select(. != "")]}' |
            gh api "repos/${repo}/git/commits" --input - --jq .sha)"
          if [[ -n "${head}" ]]; then
            gh api --method PATCH "repos/${repo}/git/refs/heads/status" \
              -f sha="${commit}" -F force=false >/dev/null
          else
            gh api "repos/${repo}/git/refs" \
              -f ref=refs/heads/status -f sha="${commit}" >/dev/null
          fi

  # The beta stage: store API calls only, so no Xcode, no Flutter, no macOS.
  ios-beta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane ios beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          PROMOTE_BUILD_NUMBER: ${{ inputs.build_number }}

  android-beta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: play-writes
      queue: max
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane android beta
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PROMOTE_BUILD_NUMBER: ${{ inputs.build_number }}

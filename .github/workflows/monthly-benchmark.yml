name: Monthly model benchmark

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      issues: write
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ranks the candidate models (ADR 0003) and lists new tool-capable models
      # from the live catalog; the report lands as an issue to decide on.
      - run: pnpm --filter @emotely/agent benchmark > report.md
      - run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Model benchmark $(date -u +%Y-%m) — review ranking + new models" \
            --label enhancement \
            --body-file report.md

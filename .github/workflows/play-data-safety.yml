name: Play Data safety

# Writes Play's Data safety declaration from
# apps/mobile/app/fastlane/data_safety.csv, the CSV the Play Console exports
# (App content → Data safety → Export to CSV), with `fastlane android
# data_safety`. The upload replaces every answer, so the CSV is the whole
# declaration. Its own workflow, so it runs only when the CSV changes: the
# declaration is what a Play reviewer compares with the privacy notice.
#
#   gh workflow run play-data-safety.yml               # by hand
#
# Until the CSV is committed the job skips with a notice.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app/fastlane/data_safety.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: release
    # The lock every Play writer holds (see app-release.yml).
    concurrency:
      group: play-writes
      queue: max
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane android data_safety
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
